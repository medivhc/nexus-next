[package]
name = "nexus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tun-rs.workspace = true
ipstack.workspace = true
nexus-net-core.workspace = true
nexus-drive-core.workspace = true
nexus-core-proto.workspace = true
nexus-wire.workspace = true
nexus-sys-real.workspace = true
nexus-fabric.workspace = true
nexus-fabric-iroh.workspace = true
nexus-runtime.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# 升级（M7.3）：解开发布的 .tar.gz、校验 SHA256SUMS。
tar = "0.4"
flate2 = "1"
# Windows 的发布包是 .zip（M11.3）。只读，解压用 flate2。
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2.workspace = true
# 输出里的时间用本地时区显示。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm.workspace = true
russh.workspace = true
futures-util.workspace = true
# 锚点（M2.4）：内置中继、HTTPS 页面、自动证书。
iroh-relay.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-rustls-acme = "0.9"

# 应用界面里加入码的二维码（M11.2）。纯计算。
qrcode = { version = "0.14", default-features = false }

# 排查问题用的日志（NEXUS_LOG）。
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

# 挂载（M4.3）：只在 Linux 上。纯 Rust，挂载时调用系统的 fusermount3。
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", default-features = false }
libc = "0.2"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dev-dependencies]
nexus-core-proto.workspace = true
nexus-wire.workspace = true
tokio.workspace = true
serde_json.workspace = true
crossterm.workspace = true
russh.workspace = true
rcgen = "0.14"
# 验证生成的二维码能被独立的识读库读出来（M11.2）。
rqrr = "0.10"

# 验收场景的测试工具只在 Unix 上（伪终端、进程组、网络命名空间）。macOS 和 Windows 上跑单元测试和
# tools/platform_check.py（M11.3）。
[target.'cfg(unix)'.dev-dependencies]
nexus-testkit.workspace = true
