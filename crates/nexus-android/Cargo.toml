[package]
name = "nexus-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android 应用里的 Nexus 核心：经 JNI 启动和停止常驻程序，网卡来自 VpnService."

target = "cfg(unix)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexus-cli = { path = "../nexus-cli" }
nexus-fabric-iroh.workspace = true
nexus-net-core.workspace = true
nexus-wire.workspace = true
tun-rs.workspace = true
tokio.workspace = true
serde_json.workspace = true
jni = { version = "0.21", default-features = false }
libc = "0.2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
