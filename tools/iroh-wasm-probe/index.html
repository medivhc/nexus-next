<!doctype html><meta charset="utf-8"><title>probe</title>
<script type="module">
import init, { ping } from './pkg/probe.js';
window.run = async (relay, id) => {
  await init();
  const t0 = performance.now();
  const reply = await ping(relay, id, "hello from browser");
  return { reply, ms: Math.round(performance.now() - t0) };
};
window.ready = true;
</script>
