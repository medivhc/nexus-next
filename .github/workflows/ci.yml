# Full CI for nexus-next, mirroring tools/ci.sh (L0 to L3).
#
# Why this exists: the sandbox only has 1.5 shared cores, so a full local
# run takes well over half an hour (clippy alone took 603s on 2026-11-16).
# The hosted runner is ephemeral: Cargo target cache restores are helpful but
# incomplete after source/lockfile changes. Sccache helps reuse rustc outputs.
# Locally, run only the fast lane (cargo check / the crate you changed);
# run all suites on main/nightly; PR changes select suites by risk.
#
# The workflow intentionally calls tools/ci.sh instead of duplicating its
# steps, so local CI and Actions CI can never drift apart. If a step needs
# to change, change tools/ci.sh, not this file. Runner-environment prep
# (e.g. freeing disk) is the exception: it lives here, before the build.
name: CI

# Always run sanity and a required gate. Native full coverage remains on main, nightly,
# manual runs, and safety-critical PR changes; browser/compat use conservative impact planning.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # nightly UTC, all lanes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs cancel their predecessors: push-to-main and the nightly
  # schedule share refs/heads/main, and cancelling a full run there would
  # silently drop the all-lane backstop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Test impact plan
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.select.outputs.smoke }}
      full: ${{ steps.select.outputs.full }}
      compat: ${{ steps.select.outputs.compat }}
      web: ${{ steps.select.outputs.web }}
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - name: Check out with full history for PR merge-base diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes, fail closed on unknown paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_plan.py --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  sanity:
    # First feedback without a compiler. A failure here is visible while Rust builds run.
    name: Fast sanity (no compilation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Structure and scripts
        run: |
          python3 tools/check.py
          python3 tools/check.py --self-test
          bash -n tools/ci.sh tools/ci-fast.sh
          python3 -m unittest discover -s tools -p 'test_ci_plan.py' -q

  smoke:
    # Smaller Rust signal, parallel to Full CI; this is not a substitute for L0–L3.
    name: Rust core smoke
    needs: plan
    if: ${{ needs.plan.outputs.smoke == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache core build
        uses: Swatinem/rust-cache@v2
        with:
          key: smoke
      - name: Unit tests for core protocol and network logic
        run: cargo test --locked --quiet -p nexus-core-proto -p nexus-wire -p nexus-term-proto -p nexus-net-core -p nexus-drive-core -p nexus-sys-sim -p nexus-web-core -p nexus-web
      - name: Clippy for nexus-web
        # crates/nexus-web is not covered by tools/ci.sh in PR mode: the
        # planner sends nexus-web-only PRs to smoke+web, skipping the ci job
        # that runs clippy --all-targets. Smoke is where it gets linted.
        run: cargo clippy --locked -p nexus-web -- -D warnings

  ci:
    name: Full CI (tools/ci.sh)
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEXUS_CI_PR_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      # Compilation-object cache across commits; complements existing Cargo target cache.
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        # 2026-11-17: main run 44029489521 died with ENOSPC (72 MB left)
        # while writing the iroh rlib. ubuntu-24.04 runners start with
        # ~14 GB free; the restored cargo cache plus a full test compile
        # exceeds it. Remove preinstalled toolchains this repo never uses
        # (Android SDK, .NET, GHC, CodeQL) and prune Docker images.
        # Keep node/python in the toolcache: later actions run on them.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Install FUSE
        # M4.3: the mount scenarios mount through fusermount3 (setuid) as the runner user.
        run: |
          sudo apt-get install -y fuse3
          sudo chmod 666 /dev/fuse
          ls -l /dev/fuse "$(command -v fusermount3)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Also keep crates that are not dependencies of the current lockfile
          # (rust-cache prunes workspace crates from the cached target dir).
          cache-all-crates: true

      - name: Install compiler object cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Run full CI
        run: bash tools/ci.sh

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Public rendezvous service (informational)
        # M6.1: short join codes go through https://dns.iroh.link/pkarr by default.
        # The sandbox cannot reach it, the runner can. An outage there must not block a commit.
        continue-on-error: true
        run: cargo test --quiet -p nexus-fabric-iroh --test public_rendezvous -- --ignored

      - name: Upload CI log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-log
          path: /tmp/nexus-ci.log
          if-no-files-found: ignore

  compat:
    # M7.1 (FP-7.1-06): the newest release tag on the same wire major version
    # must interoperate with this commit. Builds the old binary from the tag
    # and runs tools/compat_check.py both ways. Skips (with a note) when there
    # is no such tag yet, e.g. right after a major version bump.
    name: Old and new versions together
    needs: plan
    if: ${{ needs.plan.outputs.compat == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the release to test against
        id: old
        run: |
          major() { sed -n 's/^pub const WIRE_VERSION: u16 = \([0-9]*\);/\1/p' "$1"; }
          now=$(major crates/nexus-wire/src/lib.rs)
          tag=""
          for t in $(git tag --list 'v*' --sort=-v:refname); do
            if [ "$(git show "$t:crates/nexus-wire/src/lib.rs" | major /dev/stdin)" = "$now" ]; then tag=$t; break; fi
          done
          echo "wire major $now, release tag: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then echo "::notice::No release on wire major $now yet; skipping the mixed-version check."; fi

      - name: Install Rust toolchain
        if: steps.old.outputs.tag != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.old.outputs.tag != ''
        uses: Swatinem/rust-cache@v2
        with:
          key: compat

      - name: Build both versions
        if: steps.old.outputs.tag != ''
        run: |
          git worktree add ../old "${{ steps.old.outputs.tag }}"
          (cd ../old && cargo build --quiet -p nexus-cli --bin nexus --target-dir "$PWD/../old-target")
          cargo build --quiet -p nexus-cli --bin nexus

      - name: Mixed-version check
        if: steps.old.outputs.tag != ''
        run: python3 tools/compat_check.py --old-bin ../old-target/debug/nexus --new-bin target/debug/nexus

  web:
    # M8.1: build the web page (WebAssembly) and run the browser end-to-end test
    # (tools/web-e2e, test plan L4) in real headless Chrome. The sandbox cannot
    # download the wasm32 target, so this is where the page itself is checked.
    name: Web page in a real browser
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install wasm-bindgen (same version as Cargo.lock)
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
          echo "wasm-bindgen $v"
          cargo install --locked --quiet wasm-bindgen-cli --version "$v"

      - name: Install binaryen (wasm-opt >= 123)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-version_123/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: Build the page
        run: bash tools/build-web.sh

      - name: Frontend unit tests
        run: node --test web/share.test.mjs

      - name: Build nexus
        run: cargo build --release -p nexus-cli

      - name: Browser end-to-end test
        working-directory: tools/web-e2e
        run: |
          npm install --no-audit --no-fund
          node run.mjs --nexus ../../target/release/nexus --dist ../../web/dist --chrome "$(command -v google-chrome)"

  platforms:
    # M11.3 (R81–R84): there are no macOS or Windows devices to test on, so
    # the hosted runners stand in for them. Build nexus there, run the unit
    # tests that are portable, then tools/platform_check.py: two daemons on
    # the runner, join, exec, services, drive, a terminal session surviving a
    # daemon restart, upgrade and rollback. Runners have admin rights, so the
    # virtual NIC (utun / Wintun) and system DNS for .internal are real too.
    name: ${{ matrix.name }} (platform check)
    needs: plan
    if: ${{ needs.plan.outputs.platforms == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            exe: nexus
          - name: Windows
            os: windows-2022
            exe: nexus.exe
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: platforms

      - name: Build nexus
        shell: bash
        run: cargo build --release --locked -p nexus-cli --bin nexus

      - name: Portable unit tests
        timeout-minutes: 20
        # nexus-cli's scenario tests need nexus-testkit (Unix only); its unit
        # tests and nexus-sys-real's tests (session holder transport) run here.
        shell: bash
        run: |
          cargo test --release --locked -p nexus-sys-real
          cargo test --release --locked -p nexus-cli --lib --bins

      - name: Wintun next to nexus.exe
        if: runner.os == 'Windows'
        run: python tools/fetch_wintun.py target/release

      - name: Two devices on this runner
        timeout-minutes: 20
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sudo -E python3 tools/platform_check.py --bin target/release/${{ matrix.exe }} --tun
          else
            python tools/platform_check.py --bin target/release/${{ matrix.exe }} --tun
          fi

  gate:
    name: Required CI gate
    needs: [plan, sanity, smoke, ci, compat, web, platforms]
    # always() would also run on superseded runs and turn the gate red for a
    # run that was replaced, not for a real failure. !cancelled() still runs
    # the gate when a needed job fails, but not when the run itself was cut.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Verify all expected jobs succeeded
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci_gate.py
