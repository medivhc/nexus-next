<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Nexus</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <span class="brand">Nexus</span>
  <span id="who"></span>
  <span id="status" role="status"></span>
</header>
<main>
  <section id="enroll" hidden>
    <h1>登记这台设备的通行密钥</h1>
    <p>创建之后，在任何浏览器里都可以用它登录你的 Nexus。</p>
    <button id="enroll-go">创建通行密钥</button>
  </section>
  <section id="login" hidden>
    <h1>登录</h1>
    <p>用你登记过的通行密钥登录。关掉页面后，这台电脑上不留下任何东西。</p>
    <button id="login-go">用通行密钥登录</button>
  </section>
  <section id="devices" hidden>
    <h1>设备</h1>
    <ul id="device-list"></ul>
    <h1>本机硬件（需逐项明确同意）</h1>
    <p id="hw-active" class="muted">当前无人使用本机硬件。</p>
    <ul id="hw-list">
      <li><span>摄像头</span><button id="hw-camera">开启</button></li>
      <li><span>麦克风</span><button id="hw-microphone">开启</button></li>
      <li><span>位置</span><button id="hw-location">开启</button></li>
    </ul>
    <h1>工作区</h1>
    <ul id="ws-list"></ul>
    <p id="ws-none" class="muted" hidden>没有能读的工作区。工作区要保存在存储设备上（nexus drive serve on），
      通行密钥要有读它的授权：在管理设备上登记时加 <code>--grant drive.read@**</code>（另外给出终端和状态的授权）。</p>
  </section>
  <section id="files" hidden>
    <div class="bar"><button id="files-back">返回</button><span id="files-path"></span></div>
    <ul id="file-list"></ul>
    <div id="preview" hidden>
      <div class="bar"><span id="preview-name"></span><span id="preview-size" class="muted"></span><button id="preview-download">下载</button></div>
      <p id="preview-note" class="muted"></p>
      <pre id="preview-text" hidden></pre>
      <img id="preview-image" alt="" hidden>
    </div>
  </section>
  <section id="terminal" hidden>
    <div class="bar"><button id="term-leave">离开</button><span id="term-title"></span></div>
    <div id="xterm"></div>
  </section>
  <p id="error" role="alert"></p>
</main>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
