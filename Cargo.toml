[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
nexus-core-proto = { path = "crates/nexus-core-proto" }
nexus-wire = { path = "crates/nexus-wire" }
nexus-term-proto = { path = "crates/nexus-term-proto" }
nexus-web-core = { path = "crates/nexus-web-core" }
nexus-web = { path = "crates/nexus-web" }
nexus-net-core = { path = "crates/nexus-net-core" }
nexus-drive-core = { path = "crates/nexus-drive-core" }
nexus-sys = { path = "crates/nexus-sys" }
nexus-sys-real = { path = "crates/nexus-sys-real" }
nexus-sys-sim = { path = "crates/nexus-sys-sim" }
nexus-fabric = { path = "crates/nexus-fabric" }
nexus-fabric-sim = { path = "crates/nexus-fabric-sim" }
nexus-fabric-iroh = { path = "crates/nexus-fabric-iroh" }
nexus-runtime = { path = "crates/nexus-runtime" }
nexus-cli = { path = "crates/nexus-cli" }
nexus-testkit = { path = "crates/nexus-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "sync", "net", "process", "signal"] }
futures-util = "0.3"
turmoil = "0.7"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
tempfile = "3"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
proptest = "1"
# 浏览器里只能用 tls-ring、不能用端口映射；原生环境的其余默认特性由 nexus-fabric-iroh 按目标开启。
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tun-rs = { version = "2.8", features = ["async_tokio"] }
ipstack = "1.0"
iroh-relay = { version = "1.4", features = ["server"] }
# iroh 的 QUIC 实现；只用它的拥塞控制配置，版本跟随 iroh。
noq-proto = { version = "1.4", default-features = false }
vt100 = "0.18"
portable-pty = "0.9"
crossterm = "0.29"
russh = { version = "0.65", default-features = false, features = ["ring"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }

# 依赖在开发构建里也做优化：签名校验在未优化时慢一个数量级，会拖慢授权矩阵。
[profile.dev.package."*"]
opt-level = 2
# 场景测试要在仿真里搬运几 MB 的终端输出，本仓库的代码也做基本优化。
[profile.dev]
opt-level = 1

# 网页节点的 WebAssembly（tools/build-web.sh）：按体积优化。gzip 后从 1.44 MB 降到 1.03 MB。
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
